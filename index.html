        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        /* === PREMIUM MOTION LAYER - NO VISUAL CHANGE, ONLY MOVEMENT === */
        .reveal { opacity:0; transform: translateY(18px); transition: opacity 0.65s cubic-bezier(.22,1,.36,1), transform 0.65s cubic-bezier(.22,1,.36,1); }
        .reveal.in-view { opacity:1; transform: translateY(0); }

        .product-card { transition: transform 0.45s cubic-bezier(.22,1,.36,1), box-shadow 0.45s ease, border-color 0.3s ease; will-change: transform; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 18px 40px -18px rgba(0,0,0,0.22); }
        .product-card .pc-img { transition: transform 0.5s cubic-bezier(.22,1,.36,1); will-change: transform; }
        .product-card:hover .pc-img { transform: scale(1.05); }

        .chip-motion { transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease; }
        .chip-motion:active { transform: scale(0.97); }

        .btn-motion { transition: transform 0.3s ease, background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, filter 0.3s ease; }
        .btn-motion:hover { transform: translateY(-1px); }
        .btn-motion .arrow-nudge { transition: transform 0.3s cubic-bezier(.22,1,.36,1); display:inline-flex; }
        .btn-motion:hover .arrow-nudge { transform: translateX(4px); }
        .order-btn-motion { transition: transform 0.3s cubic-bezier(.22,1,.36,1), background 0.3s ease, box-shadow 0.3s ease; }
        .order-btn-motion:hover { transform: scale(1.02); }
        .order-btn-motion:active { transform: scale(0.99); }

        .hero-ken { animation: kenBurns 8s ease-in-out infinite alternate; will-change: transform; transform-origin: center center; }
        @keyframes kenBurns { from { transform: scale(1); } to { transform: scale(1.05); } }

        .hero-fade { opacity:0; transform: translateY(16px); animation: heroFadeUp 0.7s cubic-bezier(.22,1,.36,1) forwards; }
        @keyframes heroFadeUp { to { opacity:1; transform: translateY(0); } }

        .modal-backdrop-anim { animation: backdropIn 0.35s cubic-bezier(.22,1,.36,1) forwards; }
        @keyframes backdropIn { from { opacity:0; backdrop-filter: blur(0px); } to { opacity:1; backdrop-filter: blur(8px); } }
        .modal-content-anim { animation: modalSlideUp 0.42s cubic-bezier(.22,1,.36,1) forwards; }
        @keyframes modalSlideUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }
        .modal-img-zoom { transition: transform 0.6s cubic-bezier(.22,1,.36,1); }
